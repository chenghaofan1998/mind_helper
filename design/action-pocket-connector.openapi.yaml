openapi: 3.1.0
info:
  title: Action Pocket Connector API
  version: 0.2.0
  description: Provider-neutral contract. Knowledge sources own RAG/storage; multimodal connectors own screenshot analysis.
servers:
  - url: https://knowledge.example.com/action-pocket/v1
security:
  - bearerAuth: []
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Connector capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /search:
    post:
      operationId: searchKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Evidence-backed search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        default:
          $ref: '#/components/responses/Error'
  /analyze:
    post:
      operationId: analyzeInput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '200':
          description: Derived multimodal observations; never knowledge-source evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionAnalysis'
        default:
          $ref: '#/components/responses/Error'
  /write:
    post:
      operationId: writeKnowledge
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteRequest'
      responses:
        '200':
          description: Verified write receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteReceipt'
        default:
          $ref: '#/components/responses/Error'
  /locate:
    post:
      operationId: locateSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location]
              properties:
                location: { $ref: '#/components/schemas/SourceLocation' }
      responses:
        '200':
          description: Current source location and version state
          content:
            application/json:
              schema:
                type: object
                required: [requestId, location, versionState]
                properties:
                  requestId: { type: string }
                  location: { $ref: '#/components/schemas/SourceLocation' }
                  versionState: { type: string, enum: [current, changed, deleted, unknown] }
        default:
          $ref: '#/components/responses/Error'
  /status:
    get:
      operationId: getStatus
      responses:
        '200':
          description: Health and index freshness
          content:
            application/json:
              schema:
                type: object
                required: [requestId, healthy, retrievalMode]
                properties:
                  requestId: { type: string }
                  healthy: { type: boolean }
                  retrievalMode: { type: string, enum: [rag, hybrid, keyword, unavailable] }
                  indexedAt: { type: string, format: date-time }
                  message: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Stable, non-sensitive error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CapabilitiesResponse:
      type: object
      required: [requestId, source, capabilities]
      properties:
        requestId: { type: string }
        source: { $ref: '#/components/schemas/SourceDescriptor' }
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [search, rag, write, locate, status, vision-analysis, multimodal-input, observe]
        limits:
          type: object
          additionalProperties: true
    SourceDescriptor:
      type: object
      required: [id, name, connectorType]
      properties:
        id: { type: string }
        name: { type: string }
        connectorType: { type: string, enum: [knowledge-source, multimodal-analyzer, combined] }
        processingLocation: { type: string, enum: [local, cloud, hybrid] }
        defaultWriteTarget: { type: string }
    SearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 2000 }
        limit: { type: integer, minimum: 1, maximum: 20, default: 5 }
        intent: { type: string, enum: [find, command, understanding, task, decision] }
        analysisId: { type: string, description: Short-lived reference from the same connector }
        attachments:
          type: array
          description: Allowed only when multimodal-input is declared and the user explicitly consents
          items: { $ref: '#/components/schemas/AttachmentRef' }
        filters: { type: object, additionalProperties: true }
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required: [input, tasks]
      properties:
        input: { $ref: '#/components/schemas/InputEnvelope' }
        tasks:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [describe-problem, extract-text, suggest-query] }
    VisionAnalysis:
      type: object
      required: [requestId, analysisId, observations, suggestedQueries, sensitiveContentDetected, warnings]
      properties:
        requestId: { type: string }
        analysisId: { type: string }
        observations:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
              region:
                type: object
                required: [x, y, width, height]
                properties:
                  x: { type: number, minimum: 0, maximum: 1 }
                  y: { type: number, minimum: 0, maximum: 1 }
                  width: { type: number, exclusiveMinimum: 0, maximum: 1 }
                  height: { type: number, exclusiveMinimum: 0, maximum: 1 }
        problemStatement: { type: string }
        extractedText: { type: string }
        suggestedQueries: { type: array, items: { type: string }, maxItems: 5 }
        sensitiveContentDetected: { type: boolean }
        warnings: { type: array, items: { type: string } }
    SearchResponse:
      type: object
      required: [requestId, retrievalMode, results]
      properties:
        requestId: { type: string }
        retrievalMode: { type: string, enum: [rag, hybrid, keyword] }
        results:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/KnowledgeResult' }
        warnings:
          type: array
          items: { type: string }
    KnowledgeResult:
      type: object
      required: [id, evidence, location, retrieval]
      properties:
        id: { type: string }
        kind: { type: string, enum: [command, understanding, note, task, decision] }
        evidence: { $ref: '#/components/schemas/Evidence' }
        location: { $ref: '#/components/schemas/SourceLocation' }
        retrieval:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [rag, hybrid, keyword] }
            score: { type: number }
        derived:
          type: object
          properties:
            text: { type: string }
            type: { type: string, enum: [command, steps, checklist, explanation] }
            evidenceIds: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    Evidence:
      type: object
      required: [excerpt]
      properties:
        excerpt: { type: string }
        contextBefore: { type: string }
        contextAfter: { type: string }
    SourceLocation:
      type: object
      required: [sourceId, documentId, version]
      properties:
        sourceId: { type: string }
        documentId: { type: string }
        path: { type: string }
        line: { type: integer, minimum: 1 }
        blockId: { type: string }
        version: { type: string }
        uri: { type: string, format: uri }
    WriteRequest:
      type: object
      additionalProperties: false
      required: [input, target]
      properties:
        input: { $ref: '#/components/schemas/InputEnvelope' }
        target:
          type: object
          required: [sourceId, location]
          properties:
            sourceId: { type: string }
            location: { type: string }
    InputEnvelope:
      type: object
      required: [id, modality, intent, capturedAt, consent]
      properties:
        id: { type: string }
        modality: { type: string, enum: [text, image, screen, audio, event] }
        intent: { type: string, enum: [capture, query, observe] }
        content: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }
        capturedAt: { type: string, format: date-time }
        consent:
          type: object
          required: [explicit, scope]
          properties:
            explicit: { type: boolean, const: true }
            scope: { type: string }
    AttachmentRef:
      type: object
      required: [id, mediaType, size, sha256, uri, retention]
      properties:
        id: { type: string }
        mediaType: { type: string }
        size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        uri: { type: string, format: uri }
        retention: { type: string, enum: [request, session, source] }
    WriteReceipt:
      type: object
      required: [requestId, ok, location]
      properties:
        requestId: { type: string }
        ok: { type: boolean, const: true }
        location: { $ref: '#/components/schemas/SourceLocation' }
        transforms: { type: array, items: { type: string } }
    ErrorResponse:
      type: object
      required: [requestId, code, message]
      properties:
        requestId: { type: string }
        code:
          type: string
          enum: [INVALID_INPUT, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CAPABILITY_UNAVAILABLE, PAYLOAD_TOO_LARGE, RATE_LIMITED, SOURCE_STALE, TIMEOUT, UPSTREAM_UNAVAILABLE, IO_ERROR]
        message: { type: string }
        retryAfterMs: { type: integer, minimum: 0 }
