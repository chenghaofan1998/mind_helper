<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020806" flood-opacity=".45"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1C3028"/><stop offset="1" stop-color="#0C1210"/></linearGradient></defs>
  <rect x="0" y="0" width="1440" height="1000" rx="0" fill="url(#glow)" stroke="none" stroke-width="1"/>
  <circle cx="170" cy="100" r="240" fill="#2E8B75" opacity=".11"/><circle cx="1320" cy="930" r="330" fill="#43B69B" opacity=".07"/>
  <text x="72" y="74" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="700" fill="#7FA596" text-anchor="start">ACTION POCKET · PRODUCT DESIGN</text><text x="72" y="116" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">全局热键</text><text x="72" y="148" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#9DB2A9" text-anchor="start">单实例小窗 + 后台驻留，不使用键盘钩子</text>
  <rect x="112" y="210" width="1216" height="644" rx="28" fill="#F5F7F5" stroke="#34483F" stroke-width="1"/><g filter="url(#shadow)"><rect x="112" y="210" width="1216" height="644" rx="28" fill="#F5F7F5" stroke="none" stroke-width="1"/></g>
<text x="160" y="270" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#18211D" text-anchor="start">全局热键与窗口生命周期</text><text x="160" y="301" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#6E7B74" text-anchor="start">只有一个窗口实例；启动不自动读取任何内容。</text>
<rect x="1060" y="244" width="210" height="32" rx="16" fill="#276B5D" stroke="none" stroke-width="1"/><text x="1165" y="266" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Ctrl + Alt + P</text>
<rect x="168" y="370" width="42" height="42" rx="13" fill="#E7F4EF" stroke="none" stroke-width="1"/><text x="189" y="398" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#276B5D" text-anchor="middle">○</text><text x="222" y="391" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#18211D" text-anchor="start">后台驻留</text><text x="222" y="416" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#6E7B74" text-anchor="start">托盘可见 · 不监听内容</text><line x1="354" y1="391" x2="448" y2="391" stroke="#276B5D" stroke-width="3" />
<rect x="462" y="370" width="42" height="42" rx="13" fill="#E7F4EF" stroke="none" stroke-width="1"/><text x="483" y="398" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#276B5D" text-anchor="middle">⌨</text><text x="516" y="391" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#18211D" text-anchor="start">用户手势</text><text x="516" y="416" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#6E7B74" text-anchor="start">热键或托盘点击</text><line x1="650" y1="391" x2="744" y2="391" stroke="#276B5D" stroke-width="3" />
<rect x="758" y="370" width="42" height="42" rx="13" fill="#276B5D" stroke="none" stroke-width="1"/><text x="779" y="398" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">▣</text><text x="812" y="391" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#18211D" text-anchor="start">小窗显示</text><text x="812" y="416" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#6E7B74" text-anchor="start">置顶并聚焦输入</text><line x1="946" y1="391" x2="1040" y2="391" stroke="#276B5D" stroke-width="3" />
<rect x="1054" y="370" width="42" height="42" rx="13" fill="#E7F4EF" stroke="none" stroke-width="1"/><text x="1075" y="398" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#276B5D" text-anchor="middle">✓</text><text x="1108" y="391" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#18211D" text-anchor="start">完成/隐藏</text><text x="1108" y="416" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#6E7B74" text-anchor="start">Esc 或再次热键</text>
<rect x="160" y="490" width="1120" height="264" rx="20" fill="#EEF3F0" stroke="none" stroke-width="1"/><text x="190" y="532" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#18211D" text-anchor="start">键盘规则</text>
<rect x="190" y="556" width="132" height="32" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="256" y="578" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#276B5D" text-anchor="middle">Ctrl+Alt+P</text><text x="338" y="578" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#18211D" text-anchor="start">显示 / 隐藏</text>
<rect x="190" y="610" width="70" height="32" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="225" y="632" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#276B5D" text-anchor="middle">Esc</text><text x="276" y="632" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#18211D" text-anchor="start">关闭模态；否则隐藏小窗</text>
<rect x="650" y="556" width="78" height="32" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="689" y="578" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#276B5D" text-anchor="middle">Enter</text><text x="744" y="578" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#18211D" text-anchor="start">查询 / 结果主操作</text>
<rect x="650" y="610" width="118" height="32" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="709" y="632" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#276B5D" text-anchor="middle">Ctrl+Enter</text><text x="784" y="632" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#18211D" text-anchor="start">确认写入</text>
<text x="190" y="704" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="650" fill="#C54B43" text-anchor="start">注册失败时明确提示并保留托盘入口；不降级为键盘钩子。</text>
