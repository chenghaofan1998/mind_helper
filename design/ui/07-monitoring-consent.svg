<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity=".45"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1E293B"/><stop offset="1" stop-color="#0F172A"/></linearGradient></defs>
  <rect x="0" y="0" width="1440" height="1000" rx="0" fill="url(#glow)" stroke="none" stroke-width="1"/>
  <circle cx="170" cy="100" r="240" fill="#2563EB" opacity=".11"/><circle cx="1320" cy="930" r="330" fill="#60A5FA" opacity=".07"/>
  <text x="72" y="74" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="700" fill="#93C5FD" text-anchor="start">ACTION POCKET · PRODUCT DESIGN</text><text x="72" y="116" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">未来观察能力</text><text x="72" y="148" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start">显式授权、持续可见、随时停止、默认不留原始帧</text>
  <rect x="300" y="190" width="840" height="704" rx="28" fill="#F8FAFC" stroke="#475569" stroke-width="1"/><g filter="url(#shadow)"><rect x="300" y="190" width="840" height="704" rx="28" fill="#F8FAFC" stroke="none" stroke-width="1"/></g>
<rect x="340" y="226" width="174" height="32" rx="16" fill="#FBECEA" stroke="none" stroke-width="1"/><text x="427" y="248" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#C54B43" text-anchor="middle">未来能力 · 默认关闭</text><text x="340" y="292" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#172033" text-anchor="start">开始一次可见的观察会话</text><text x="340" y="325" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#526071" text-anchor="start">视觉识别与小模型只有在你明确授权后工作。</text>
<rect x="340" y="366" width="760" height="88" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="362" y="389" width="42" height="42" rx="13" fill="#DBEAFE" stroke="none" stroke-width="1"/><text x="383" y="417" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle">▣</text><text x="418" y="408" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#526071" text-anchor="start">观察范围</text><text x="418" y="433" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#172033" text-anchor="start">仅指定应用窗口 · 不采集其他桌面内容</text>
<rect x="340" y="470" width="760" height="88" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="362" y="493" width="42" height="42" rx="13" fill="#DBEAFE" stroke="none" stroke-width="1"/><text x="383" y="521" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle">⌛</text><text x="418" y="512" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#526071" text-anchor="start">保留策略</text><text x="418" y="537" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#172033" text-anchor="start">原始帧仅会话内存 · 默认只保留结构化事件</text>
<rect x="340" y="574" width="760" height="88" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="362" y="597" width="42" height="42" rx="13" fill="#DBEAFE" stroke="none" stroke-width="1"/><text x="383" y="625" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle">↗</text><text x="418" y="616" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#526071" text-anchor="start">数据去向</text><text x="418" y="641" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#172033" text-anchor="start">本机小模型 · 不发送云端 · 不自动写知识库</text>
<rect x="340" y="686" width="760" height="54" rx="14" fill="#FBECEA" stroke="none" stroke-width="1"/><text x="364" y="719" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="700" fill="#C54B43" text-anchor="start">● 观察中必须持续显示托盘与小窗状态，可一键停止</text>
<rect x="340" y="774" width="260" height="48" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="470" y="805" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#172033" text-anchor="middle">取消</text><rect x="620" y="774" width="480" height="48" rx="14" fill="#2563EB" stroke="#2563EB" stroke-width="1"/><text x="860" y="805" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="650" fill="#FFFFFF" text-anchor="middle">我理解并开始本次会话</text>
<text x="340" y="858" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#526071" text-anchor="start">该页面是扩展预留，不代表 MVP 已实现监控。</text>
  <text x="1368" y="962" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="end">DESIGN BASELINE · 2026</text>
</svg>