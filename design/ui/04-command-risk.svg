  <rect x="462" y="276" width="98" height="32" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="511" y="298" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#526071" text-anchor="middle">查询结果</text><text x="462" y="337" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#172033" text-anchor="start">重置到上一个 Git 状态</text>
