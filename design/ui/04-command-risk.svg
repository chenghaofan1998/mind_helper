  <line x1="462" y1="842" x2="978" y2="842" stroke="#CBD5E1" stroke-width="1" /><text x="466" y="870" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="500" fill="#526071" text-anchor="start">Ctrl  Alt  P · 隐藏</text><text x="974" y="870" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="500" fill="#526071" text-anchor="end">本地 · 不执行命令</text>
